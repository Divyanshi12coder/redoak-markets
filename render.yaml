services:
  - type: web
    name: redoak-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: CORS_ORIGINS
        sync: false

      - key: MARKET_DATA_PROVIDER
        value: twelvedata

      - key: MARKET_DATA_API_KEY
        sync: false

      - key: LLM_API_KEY
        sync: false

      - key: ML_PERSIST_MODELS
        value: "false"